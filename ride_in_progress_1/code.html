<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-bright": "#2c2c2d",
                    "secondary-dim": "#9c48ea",
                    "surface-dim": "#0e0e0f",

                    "on-tertiary-container": "#003047",

                    "surface": "#0e0e0f",

                    "secondary-fixed": "#e5c6ff",
                    "on-background": "#ffffff",
                    "primary-fixed": "#9396ff",
                    "on-secondary": "#33005b",

                    "primary-container": "#9396ff",

                    "on-tertiary-fixed": "#001a29",
                    "secondary": "#c180ff",
                    "on-surface-variant": "#adaaab",
                    "surface-container-highest": "#262627",
                    "primary": "#a3a6ff",
                    "surface-container": "#1a191b",
                    "on-primary": "#0f00a4",
                    "tertiary": "#61c2ff",
                    "error-dim": "#d73357",

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",

            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-glass {
            background: rgba(22, 22, 23, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(14, 14, 15, 0.8) 0%, rgba(14, 14, 15, 0) 25%, rgba(14, 14, 15, 0) 70%, rgba(14, 14, 15, 1) 100%);
        }
        /* Optimize for small screens to prevent clipping */
        @media (max-height: 700px) {
            .driver-card-content {
                padding: 1rem !important;
            }
            .driver-info-header {
                margin-bottom: 1rem !important;
            }
            .driver-image {
                width: 4rem !important;
                height: 4rem !important;
            }
            .action-buttons {
                gap: 0.5rem !important;
            }
            .action-buttons button {
                padding: 0.75rem !important;
                font-size: 0.875rem !important;
            }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body overflow-hidden">
<header class="fixed top-0 w-full z-50 bg-[#0e0e0f]/60 backdrop-blur-3xl flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-4">
<button class="hover:bg-zinc-800/40 active:scale-95 transition-all duration-200 text-zinc-100 p-2 rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
<span class="font-semibold tracking-tight text-zinc-100">В пути</span>
</div>
<div class="flex items-center gap-3">
<div class="text-right hidden sm:block">
<p class="text-[10px] uppercase tracking-widest text-zinc-500 font-bold">Прибытие через</p>
<p class="text-indigo-400 font-bold text-sm">12 мин</p>
</div>
<div class="w-9 h-9 rounded-full border border-indigo-400/30 overflow-hidden">
<img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCp5pYuzW-fMCwtROxlmISnAT0Uhw3f9tR8C66ctug0Eo0ZfeiJjdhtA3rcmnevBFOLPqoms5ZQ3BhST5-VdUStuiY3bYnArQPsO-9sMx5fVXCicEcE4Zps26OC24tkSCjjEXAjCRJ4IIsGjw9QUQnglZIYlW_wZAccsmYaQLm3DXRsn-zBuH_kyGeF0LRNzcJFQpDVoeKIE20Y7avIntf16s1z4T07NbcmPvbUewkYegfehdQnL-PrcxwpknSFE-nWEASPEBqq-NE"/>
</div>
</div>
</header>
<main class="relative w-full h-screen">
<div class="absolute inset-0 w-full h-full bg-surface-dim">
<img class="w-full h-full object-cover opacity-60" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtfog1xCSKXDCURsGCLx1s-wV2fKXDVeUVc7kx4x5pS9A35CxRYJhGl8qnnlmxsKPGXDQbpajwQjz0A79SevILlQH46yAS9VT7dTP67hUiI4v_kvIQgErs-0TZzfKwSithnIaZ39gW7BW3DZi3mNjkgBlXOCPkYiacy_hKbniOgrvptXOmXfkE7ILONC_IV9Z2wyo_8D-4Ovd06yQWoV8xAtFIe1NP238X0H47_RMrV_zCBbTL6zxs6O9S2Px1U3kx9TcNxhJA_7k"/>
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none">
<path class="drop-shadow-[0_0_15px_rgba(163,166,255,0.6)]" d="M 200,800 Q 400,600 300,400 T 500,100" fill="none" stroke="url(#routeGradient)" stroke-linecap="round" stroke-width="6"></path>
<defs>
<lineargradient id="routeGradient" x1="0%" x2="100%" y1="100%" y2="0%">
<stop offset="0%" style="stop-color:#c180ff;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#a3a6ff;stop-opacity:1"></stop>
</lineargradient>
</defs>
</svg>
<div class="absolute top-[15%] left-[65%] -translate-x-1/2 -translate-y-1/2">
<div class="relative flex items-center justify-center">
<div class="absolute w-12 h-12 bg-tertiary/20 rounded-full animate-ping"></div>
<div class="w-4 h-4 bg-tertiary rounded-full border-2 border-on-background shadow-[0_0_15px_rgba(97,194,255,0.8)]"></div>
</div>
</div>
<div class="absolute bottom-[40%] left-[25%]">
<div class="relative flex items-center justify-center">
<div class="absolute w-16 h-16 bg-primary/20 rounded-full animate-pulse"></div>
<span class="material-symbols-outlined text-primary text-4xl drop-shadow-md" style="font-variation-settings: 'FILL' 1;">local_taxi</span>
</div>
</div>
</div>
<div class="absolute top-20 left-1/2 -translate-x-1/2 w-[92%] max-w-md">
<div class="bg-surface-container-highest/70 backdrop-blur-xl p-3 rounded-2xl border border-outline-variant/20 flex items-center gap-3 shadow-2xl">
<div class="bg-primary/20 p-2 rounded-xl flex-shrink-0">
<span class="material-symbols-outlined text-primary text-xl">location_on</span>
</div>
<div class="min-w-0">
<p class="text-on-surface-variant text-[10px] uppercase tracking-widest font-bold leading-tight">Место назначения</p>
<p class="text-on-surface font-semibold text-sm truncate leading-tight">Проспект Абая, 103 (The Ritz-Carlton)</p>
</div>
</div>
</div>
<div class="fixed bottom-0 left-0 w-full z-40 p-4 pb-8 flex justify-center">
<div class="w-full max-w-lg bg-glass rounded-[32px] overflow-hidden border border-outline-variant/10 shadow-[0_-20px_40px_rgba(0,0,0,0.5)]">
<div class="px-6 py-2.5 bg-primary/10 border-b border-primary/5 flex justify-between items-center">
<span class="text-primary text-[10px] font-bold uppercase tracking-widest">В процессе поездки</span>
<span class="text-on-surface font-bold text-xs tracking-tight">8.4 км до финиша</span>
</div>
<div class="driver-card-content p-6">
<div class="driver-info-header flex items-start justify-between mb-6 gap-4">
<div class="flex items-center gap-4 min-w-0">
<div class="relative flex-shrink-0">
<img class="driver-image w-16 h-16 rounded-2xl object-cover border-2 border-surface-bright shadow-lg" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClQKr2lA6OZH6mtJRPKDom02uJ5Tfyrr4vD73TS5twEZp60CKOahEm5VAOaU7czAeR7pH9rJrRXBMwsfzQksGCufU9ltlKuXFAXWPtNoDCj5FOOAb2Jg1KJeLZsYBNIQ49DJH9n8fcFMe59_NHLOPHNKH7-pKINwlq6_vA53fURpPITug899T5rK8nrkRyk42eex4P95NVb9zrvTHXzqbMHna_6DPyWuGqk7m-p3GXGYgemOhdBQoj7pVoKRoqVpBC-rN28hiXpos"/>
<div class="absolute -bottom-1 -right-1 bg-secondary text-on-primary-fixed px-1.5 py-0.5 rounded-md text-[9px] font-black tracking-tighter shadow-md">TOP</div>
</div>
<div class="min-w-0">
<h2 class="text-xl font-black tracking-tight text-on-surface truncate">Константин</h2>
<div class="flex items-center gap-1 mt-0.5">
<span class="material-symbols-outlined text-secondary text-[12px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-on-surface-variant text-xs font-semibold tracking-tight">4.96 • 1,240 поездок</span>
</div>
<p class="text-on-surface-variant text-[11px] mt-0.5 font-medium italic opacity-75 truncate">"Лучший маршрут для вас"</p>
</div>
</div>
<div class="text-right flex-shrink-0">
<div class="bg-surface-container-high rounded-xl px-3 py-1.5 border border-outline-variant/20 inline-block">
<p class="text-on-surface font-bold tracking-tighter text-sm leading-tight">BMW 5-Series</p>
<p class="text-primary font-black text-xs tracking-wider uppercase">777 AAA 02</p>
</div>
<p class="text-[9px] text-zinc-500 uppercase tracking-widest mt-1.5 font-bold">Premium Class</p>
</div>
</div>
<div class="action-buttons grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-4 px-4 rounded-2xl bg-gradient-to-br from-primary to-secondary text-on-primary-fixed font-bold text-sm tracking-tight active:scale-[0.98] transition-all shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-lg">call</span>
                        Позвонить
                    </button>
<button class="flex items-center justify-center gap-2 py-4 px-4 rounded-2xl bg-surface-variant/40 hover:bg-surface-variant/60 border border-outline-variant/15 text-on-surface font-bold text-sm tracking-tight active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-lg">close</span>
                        Отменить
                    </button>
</div>
</div>
<div class="flex justify-center pb-3 opacity-20">
<div class="w-10 h-1 bg-on-surface-variant rounded-full"></div>
</div>
</div>
</div>
</main>
</body></html>
