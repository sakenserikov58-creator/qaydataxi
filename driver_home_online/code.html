<!DOCTYPE html>

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(22, 22, 23, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }
        .tonal-shift-no-border { border: none !important; }
        .map-gradient-overlay {
            background: radial-gradient(circle at center, transparent 0%, #0e0e0f 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface overflow-hidden">
<!-- Background Map Layer -->
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover grayscale brightness-[0.3]" data-alt="Dark stylized vector map of Almaty city with neon blue and violet transit lines glowing in the mist" data-location="Almaty" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAmAcYeyZhxiNJOw3OpXMlO54aKEJNxNsB4UZFHUIH6x0AhERp321EvKhxf6QtMImG2vvV2fPkFVTacHaM-WNrRIrDdXst1TQNh_V7PTDBBUsM5POBSCHajxeDEYpfPSqnv9Y2rXJCjO4UfDD0554dp0xZ4kPagvHzEVhpa_30rahuty5__d-5dZXMUsXcSiwUgSU61Q_vdz4XoiQrG-_ypADDZXJcVzJO5NtjcwS0pzqu2HX93COlq_WCU2-6zIpGM9k5_AzuWGTk"/>

</div>

<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-zinc-800/40 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-indigo-400">menu</span>
</button>
<div class="font-['Inter'] font-semibold tracking-tight text-zinc-100 text-xl font-bold tracking-tighter text-zinc-50">
                Obsidian
            </div>
</div>
<!-- Online/Offline Toggle -->
<div class="flex items-center bg-surface-container-lowest rounded-full p-1 border border-outline-variant/15">
<button class="px-6 py-2 rounded-full bg-indigo-500/10 text-indigo-400 text-sm font-bold transition-all duration-300 flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></div>
                В СЕТИ
            </button>
<button class="px-6 py-2 rounded-full text-zinc-500 text-sm font-medium hover:text-zinc-300 transition-all">
                ПАУЗА
            </button>
</div>
<div class="w-10 h-10 rounded-full border-2 border-indigo-400/30 overflow-hidden active:scale-95 transition-all duration-200">
<img alt="Profile" class="w-full h-full object-cover" data-alt="Close-up portrait of a professional man with a confident expression, modern haircut, soft studio lighting on dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCm7l4R21NF55XQG9wuXnc8o6rxY4X1ZDrtdGYpJS72ZtR4tMMZ_ds-98Zqd8V7yuGbwWjYFRGgKvYD7snvp9Nb9oVT6jI8jafX71QNZxtRhLf62_fnRjnoOguuWDxP9XEnQd5poY-vx3yPPptB_Rvsf6ATPspptZh14-LBCj31TOBF2IDfb-7nmBoHxXx41XZK8OgpFBBntNZEP0_22mcKGDHRcOVUlvCdkyXsd7N-YHuHw_WZWkmLf9agb8noBk3QrGy8k7z14PM"/>
</div>
</header>

<div class="grid grid-cols-2 gap-4">

<div class="col-span-2 glass-panel rounded-[32px] p-6 shadow-2xl relative overflow-hidden group">
<div class="absolute top-0 right-0 p-8 opacity-10 group-hover:opacity-20 transition-opacity">
<span class="material-symbols-outlined text-8xl text-primary">account_balance_wallet</span>
</div>
<div class="flex justify-between items-start mb-8">
<div>
<p class="text-on-surface-variant text-sm font-medium tracking-wide">Доход сегодня</p>
<h2 class="text-4xl font-extrabold tracking-tight mt-1">24 850 ₸</h2>
</div>
<div class="bg-indigo-500/20 px-3 py-1 rounded-lg">
<span class="text-indigo-300 text-xs font-bold">+12%</span>
</div>
</div>
<div class="flex items-center gap-6">
<div class="flex flex-col">
<span class="text-on-surface-variant text-[11px] uppercase tracking-widest font-bold">Поездки</span>
<span class="text-lg font-semibold">14</span>
</div>
<div class="h-8 w-[1px] bg-outline-variant/30"></div>
<div class="flex flex-col">
<span class="text-on-surface-variant text-[11px] uppercase tracking-widest font-bold">В пути</span>
<span class="text-lg font-semibold">6ч 42м</span>
</div>
<div class="ml-auto">
<button class="bg-surface-variant/40 hover:bg-surface-variant/60 p-2 rounded-xl transition-colors">
<span class="material-symbols-outlined text-indigo-400">chevron_right</span>
</button>
</div>
</div>
</div>
<!-- Secondary Stats -->
<div class="glass-panel rounded-[32px] p-5 flex flex-col justify-between aspect-square">
<div class="w-10 h-10 rounded-2xl bg-tertiary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary">star</span>
</div>
<div>
<p class="text-on-surface-variant text-xs font-medium">Рейтинг</p>
<h3 class="text-2xl font-bold">4.98</h3>
</div>
</div>
<div class="glass-panel rounded-[32px] p-5 flex flex-col justify-between aspect-square">
<div class="w-10 h-10 rounded-2xl bg-secondary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary">local_fire_department</span>
</div>
<div>
<p class="text-on-surface-variant text-xs font-medium">Активность</p>
<h3 class="text-2xl font-bold">96%</h3>
</div>
</div>
</div>
</div>
<!-- Floating Map Elements -->
<div class="mt-auto mb-6 pointer-events-auto">
<div class="flex flex-col gap-4 items-end">
<button class="w-14 h-14 rounded-2xl glass-panel shadow-lg flex items-center justify-center hover:bg-zinc-800/40 active:scale-90 transition-all">
<span class="material-symbols-outlined text-on-surface">my_location</span>
</button>
<button class="w-14 h-14 rounded-2xl glass-panel shadow-lg flex items-center justify-center hover:bg-zinc-800/40 active:scale-90 transition-all">

</button>
</div>
</div>

</div>
<div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
<div class="flex-shrink-0 bg-surface-container-lowest px-4 py-3 rounded-2xl flex items-center gap-3 border border-outline-variant/10">
<span class="material-symbols-outlined text-indigo-400 text-sm">bolt</span>
<span class="text-sm font-medium">Медеу: x1.4</span>
</div>
<div class="flex-shrink-0 bg-surface-container-lowest px-4 py-3 rounded-2xl flex items-center gap-3 border border-outline-variant/10">
<span class="material-symbols-outlined text-indigo-400 text-sm">bolt</span>
<span class="text-sm font-medium">Центр: x1.2</span>
</div>
<div class="flex-shrink-0 bg-surface-container-lowest px-4 py-3 rounded-2xl flex items-center gap-3 border border-outline-variant/10">
<span class="material-symbols-outlined text-indigo-400 text-sm">bolt</span>
<span class="text-sm font-medium">Аэропорт: x1.8</span>
</div>
</div>
</div>

<nav class="fixed bottom-0 w-full bg-[#161617]/40 backdrop-blur-2xl rounded-t-[32px] z-50 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.4)] flex justify-around items-center px-4 py-3 w-full">

<a class="flex flex-col items-center justify-center text-indigo-400 bg-indigo-500/10 rounded-2xl px-6 py-2 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_taxi</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-widest mt-1">Поездка</span>
</a>
<!-- Item: История -->
<a class="flex flex-col items-center justify-center text-zinc-500 py-2 hover:text-zinc-300 active:scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-widest mt-1">История</span>
</a>

<span class="material-symbols-outlined">person</span>
<span class="font-['Inter'] text-[11px] font-medium uppercase tracking-widest mt-1">Профиль</span>
</a>
