    content: "";

    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    background: #a3a6ff;
    border-radius: 50%;
    opacity: 0.3;
    z-index: -1

</button>
<div class="font-['Inter'] font-semibold tracking-tight text-zinc-100 text-xl font-bold tracking-tighter text-zinc-50">

<div class="h-10 w-10 rounded-full overflow-hidden border border-outline-variant/15 active:scale-95 transition-all duration-200">

</div>
<p class="text-on-surface font-semibold text-sm">Business • 3 450 ₸</p>
</div>
</div>
