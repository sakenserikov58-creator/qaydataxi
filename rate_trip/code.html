<body class="antialiased overflow-hidden selection:bg-primary/30">
<!-- Background Map Canvas -->
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover opacity-40 scale-110 blur-xl" data-alt="Blurred night city map of Almaty with glowing street lights and dark navy tones, aerial view" data-location="Almaty" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQXQCDbZ9OHr3ukP6DKgkFoFXGnL7P2366t8ZWvXJd5XlHza5598yn3JH1op8zuC10Z7LiHkK6Vma0mBvYKs2ntTYco58iza2csGAUlDECbyjDM-vdK8PgK0JDez193sY30FMTQi-LWxHh-5KLuuCIax39qFkmb3fCikGK_BUuqNO06g5fj6c6rnVWP1-ypom3xMMzD-sAbmTVonX32D0Usz0FgWBO-aOHZJWDWG-2tk6faPoHOCQTtNMz6wE-9w2TRHDnULQvqzw"/>

<main class="relative z-10 flex flex-col items-center justify-end min-h-screen pb-12 px-6">
<!-- Header Content -->
<div class="w-full max-w-md mb-8 text-center">
<h1 class="text-4xl font-extrabold tracking-tighter text-on-surface mb-2">Как прошла поездка?</h1>
<p class="text-on-surface-variant font-medium">Ваш отзыв поможет сделать Ether лучше</p>
</div>
<!-- Rating Card -->
<div class="w-full max-w-md glass-panel ghost-border rounded-[32px] p-8 shadow-2xl flex flex-col items-center space-y-8">
<!-- Driver Profile -->
<div class="flex flex-col items-center text-center">
<div class="relative group">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-xl group-hover:bg-primary/40 transition-all duration-500"></div>
<img alt="Driver Avatar" class="relative w-24 h-24 rounded-full object-cover border-2 border-white/10" data-alt="Professional portrait of a friendly male driver in a dark polo shirt, warm studio lighting, clean background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCq-riorkkKIgOm3x5rjErwHRrkrRGE-jB5gSq7xLIltaySvu5Ysqz7A0DBMvXAGLQvdKp7o9uJwW2Uuq8UaQ3tVNiIjNAf5oyGsXL54ONRAI6t7K4ivESnOQLIgXOdyI4gzGEbp8lEJgmGMxxm2OGs0qqx53F1Tmp0bX0EAwSjAxqgY6np-OdLIA-L-O1btVPlpIrLAH2lSbXQK1-62u6YxF3zv0UEx5o5QuXCbzyHDbmlLCqVbgtsl3o331F8Fcwy_tl51RD5IMs"/>
</div>
<h2 class="mt-4 text-xl font-bold tracking-tight text-on-surface">Александр</h2>
<div class="flex items-center gap-1 mt-1 text-on-surface-variant">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-sm font-semibold tracking-wider">4.98 • Mercedes-Benz S-Class</span>
</div>
</div>
<!-- Star Rating Component -->
<div class="flex gap-3">
<button class="text-primary hover:scale-110 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="text-primary hover:scale-110 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="text-primary hover:scale-110 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="text-primary hover:scale-110 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="text-zinc-700 hover:text-primary/50 hover:scale-110 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-5xl">star</span>
</button>
</div>
<!-- Tags Selection -->
<div class="w-full space-y-4">
<p class="text-center text-sm font-bold uppercase tracking-widest text-on-surface-variant">Что вам понравилось?</p>
<div class="flex flex-wrap justify-center gap-2">
<button class="px-5 py-2.5 rounded-full bg-white/5 ghost-border text-sm font-medium hover:bg-primary/20 hover:text-primary transition-colors">Вежливость</button>
<button class="px-5 py-2.5 rounded-full bg-primary/10 border border-primary/20 text-primary text-sm font-bold">Чистый салон</button>
<button class="px-5 py-2.5 rounded-full bg-white/5 ghost-border text-sm font-medium hover:bg-primary/20 hover:text-primary transition-colors">Музыка</button>
<button class="px-5 py-2.5 rounded-full bg-white/5 ghost-border text-sm font-medium hover:bg-primary/20 hover:text-primary transition-colors">Вождение</button>
</div>
</div>
<!-- Comment Input -->
<div class="w-full group">
<textarea class="w-full bg-transparent border-0 border-b border-white/10 focus:border-primary focus:ring-0 text-on-surface placeholder:text-on-surface-variant py-4 px-0 transition-all resize-none min-h-[60px]" placeholder="Ваш отзыв"></textarea>
</div>
<!-- Submit Action -->
<button class="w-full premium-gradient text-on-primary-fixed font-bold py-5 rounded-full shadow-lg shadow-primary/20 active:scale-[0.98] transition-all duration-300">
                Готово
            </button>
<!-- Bottom Skip -->
<button class="text-on-surface-variant text-sm font-medium hover:text-on-surface transition-colors">
                Пропустить
            </button>
</div>
</main>
<!-- Header (Based on Shared Components) -->
<header class="fixed top-0 w-full z-50 bg-[#0e0e0f]/60 backdrop-blur-2xl border-b border-white/5 flex items-center justify-between px-6 h-16 shadow-[0_20px_40px_rgba(0,0,0,0.4)]">
<button class="text-white hover:bg-white/10 p-2 rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
<div class="text-xl font-bold tracking-tighter text-white font-['Inter']">Ether</div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-white/10">

</div>
