<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0e0e0f",
                        "on-error-container": "#ffb2b9",
                        "on-tertiary": "#003b56",
                        "on-surface": "#ffffff",
                        "on-primary-fixed": "#000000",
                        "tertiary": "#61c2ff",
                        "background": "#0e0e0f",
                        "on-tertiary-container": "#003047",
                        "tertiary-fixed-dim": "#25adf1",
                        "primary": "#a3a6ff",
                        "tertiary-fixed": "#40bbff",
                        "surface-dim": "#0e0e0f",
                        "on-surface-variant": "#adaaab",
                        "primary-container": "#9396ff",
                        "surface-variant": "#262627",
                        "secondary-dim": "#9c48ea",
                        "primary-fixed": "#9396ff",
                        "on-primary-container": "#0a0081",
                        "on-secondary-container": "#e9cdff",
                        "tertiary-dim": "#17a8ec",
                        "surface-container-low": "#131314",
                        "on-tertiary-fixed-variant": "#003d5a",
                        "on-secondary-fixed": "#4f0089",
                        "outline": "#767576",
                        "on-primary-fixed-variant": "#0e009d",
                        "error": "#ff6e84",
                        "primary-fixed-dim": "#8387ff",
                        "secondary-fixed-dim": "#dbb4ff",
                        "on-tertiary-fixed": "#001a29",
                        "surface-container-high": "#201f21",
                        "inverse-on-surface": "#565556",
                        "primary-dim": "#6063ee",
                        "on-primary": "#0f00a4",
                        "inverse-primary": "#494bd7",
                        "on-secondary": "#33005b",
                        "surface-tint": "#a3a6ff",
                        "on-background": "#ffffff",
                        "secondary-container": "#6f00be",
                        "on-secondary-fixed-variant": "#7511c3",
                        "outline-variant": "#484849",
                        "error-dim": "#d73357",
                        "secondary-fixed": "#e5c6ff",
                        "secondary": "#c180ff",
                        "surface-container-highest": "#262627",
                        "surface-container-lowest": "#000000",
                        "on-error": "#490013",
                        "error-container": "#a70138",
                        "surface-bright": "#2c2c2d",
                        "tertiary-container": "#34b5fa",
                        "surface-container": "#1a191b",
                        "inverse-surface": "#fcf8f9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0e0e0f;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(38, 38, 39, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .glow-primary {
            box-shadow: 0 0 20px rgba(163, 166, 255, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col">
<!-- TopAppBar Section (Based on Shared Components JSON) -->
<header class="fixed top-0 w-full z-50 bg-[#0e0e0f]/60 backdrop-blur-2xl border-b border-white/5 shadow-[0_20px_40px_rgba(0,0,0,0.4)] h-16 flex items-center justify-between px-6 font-['Inter'] tracking-tight antialiased">
<div class="flex items-center gap-4">
<button class="text-[#a3a6ff] hover:bg-white/10 transition-colors active:scale-95 transition-transform duration-200 rounded-full p-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="text-white font-bold tracking-tighter text-base">Константин</span>
<span class="text-zinc-500 text-[10px] uppercase tracking-widest font-semibold">На заказе • Toyota Camry</span>
</div>
</div>
<div class="flex items-center gap-3">
<button class="text-[#a3a6ff] hover:bg-white/10 transition-colors active:scale-95 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="call">call</span>
</button>
<div class="w-10 h-10 rounded-full overflow-hidden border border-white/10">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="Close up portrait of a friendly middle-aged man with a neat beard, professional lighting, cinematic urban background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFFGhrDxj0fCWWQ3d7DhAbZIXvKugH-kaEcFw0nFam4OLZW1KXjzAhwVfRWx--XlnHF-hsL8S2Shp2HOxZADKR98KncitodmgmkzdKQLPwOj6teAkvevGBDbLdOkksiKLYq5Zo59f-dCYYkCVOSErxz5oJWDPdmlOlZ2myow6f6EGeRoV9i6hYWCpFZi9QPBydCVIbLqJq4OekT4JXT0LPZ9vMUaJ7dxv-ycIiJLkysnxkKi5GQ_yXCZhdKO0e2xlIG0THz2fBjBI"/>
</div>
</div>
</header>
<!-- Chat Canvas -->
<main class="flex-1 mt-16 mb-24 px-6 py-8 overflow-y-auto space-y-8 max-w-3xl mx-auto w-full">
<!-- Date Indicator -->
<div class="flex justify-center">
<span class="text-[10px] uppercase tracking-[0.2em] text-zinc-600 font-bold">Сегодня</span>
</div>
<!-- Driver Message -->
<div class="flex flex-col items-start gap-2 max-w-[85%]">
<div class="glass-card glow-primary rounded-2xl rounded-tl-none p-4 border border-white/5 relative">
<p class="text-on-surface text-sm leading-relaxed">Я уже подъезжаю, буду через 2 минуты</p>
<div class="absolute -left-2 top-0 w-4 h-4 glass-card border-l border-t border-white/5 rotate-45 -z-10"></div>
</div>
<span class="text-[10px] text-zinc-500 ml-1">14:20</span>
</div>
<!-- User Message -->
<div class="flex flex-col items-end gap-2 max-w-[85%] ml-auto">
<div class="bg-gradient-to-br from-primary to-secondary rounded-2xl rounded-tr-none p-4 shadow-[0_10px_30px_rgba(163,166,255,0.2)]">
<p class="text-on-primary-fixed text-sm font-medium leading-relaxed">Хорошо, выхожу</p>
</div>
<div class="flex items-center gap-1 mr-1">
<span class="text-[10px] text-zinc-500">14:21</span>
<span class="material-symbols-outlined text-[12px] text-primary" data-icon="done_all">done_all</span>
</div>
</div>
<!-- Driver Typing Indicator (Simulated) -->
<div class="flex items-center gap-2 text-zinc-600 animate-pulse">
<div class="w-1 h-1 bg-zinc-600 rounded-full"></div>
<div class="w-1 h-1 bg-zinc-600 rounded-full"></div>
<div class="w-1 h-1 bg-zinc-600 rounded-full"></div>
<span class="text-[10px] uppercase tracking-widest font-bold ml-2">Константин печатает</span>
</div>
</main>
<!-- Input Bar -->
<footer class="fixed bottom-0 w-full px-6 pb-8 pt-4 bg-[#0e0e0f]/80 backdrop-blur-3xl z-50">
<div class="max-w-3xl mx-auto flex items-center gap-3">
<div class="flex-1 flex items-center bg-surface-container-highest/50 backdrop-blur-xl rounded-full px-5 py-3 border border-white/5 focus-within:border-primary/50 transition-all group">
<button class="text-zinc-500 hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="attach_file">attach_file</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-zinc-600 text-sm mx-3" placeholder="Сообщение..." type="text"/>
<button class="text-zinc-500 hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="sentiment_satisfied">sentiment_satisfied</span>
</button>
</div>
<button class="w-12 h-12 flex items-center justify-center bg-gradient-to-br from-primary to-secondary text-on-primary-fixed rounded-full shadow-[0_10px_20px_rgba(163,166,255,0.3)] active:scale-90 transition-transform duration-300">
<span class="material-symbols-outlined font-bold" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</footer>
<!-- Background Decorative Elements -->
<div class="fixed inset-0 pointer-events-none -z-20 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[400px] h-[400px] bg-secondary/5 blur-[100px] rounded-full"></div>
<!-- Subtle Grid Pattern -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#ffffff 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
</div>
</body></html>
